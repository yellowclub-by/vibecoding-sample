<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повтори сайт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="area header" data-label="Шапка">
        <div class="block logo">Логотип</div>
        <nav class="area menu" data-label="Меню">
            <div class="block menu-item">Пункт 1</div>
            <div class="block menu-item">Пункт 2</div>
            <div class="block menu-item">Пункт 3</div>
        </nav>
    </header>

    <div class="block banner">Большой баннер</div>

    <div class="page">
        <aside class="block sidebar">Боковая панель</aside>

        <main class="area content" data-label="Содержимое">
            <div class="cards">
                <div class="block card">Карточка 1</div>
                <div class="block card">Карточка 2</div>
                <div class="block card">Карточка 3</div>
                <div class="block card">Карточка 4</div>
                <div class="block card">Карточка 5</div>
                <div class="block card">Карточка 6</div>
            </div>

            <div class="about">
                <div class="block picture">Картинка</div>
                <div class="block text">Текст рядом с картинкой</div>
            </div>
        </main>
    </div>

    <footer class="area footer" data-label="Подвал">
        <div class="block footer-item">Название сайта</div>
        <div class="block footer-item">Год</div>
    </footer>
</body>
</html>
